<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stabat Mater</title>
    <style>
        /* Estilos CSS para mejorar la apariencia y ocultar los reproductores nativos */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1, h2 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
            transition: background-color 0.2s;
        }
        /* * NUEVOS ESTILOS PARA EL SELECTOR DE PISTAS 
         * Igualamos el padding y la fuente para que el tamaño coincida
         */
        #track-selector {
        padding: 10px 15px; /* Ligeramente menos padding que el botón para compensar el desplegable */
        font-size: 18px;
        border-radius: 5px;
        border: 1px solid #ccc; /* Añadimos un borde discreto */
        background-color: white;
        cursor: pointer;
        /* Esto es clave para alinear la altura con los botones */
        height: 44px; 
        }        
        #iniciar-musica {
            background-color: #4CAF50; /* Verde */
            color: white;
        }
        #parar-musica {
            background-color: #f44336; /* Rojo */
            color: white;
        }
        #parar-musica:disabled, #iniciar-musica:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        audio {
            display: none; /* Oculta los reproductores nativos */
        }
        .progress-container {
            width: 90%;
            height: 8px;
            background: #ccc;
            border-radius: 4px;
            cursor: default;
            margin: 10px 0;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: #007bff; /* Azul */
            border-radius: 4px;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap; /* Para mejor visualización en pantallas pequeñas */
        }
        input[type="range"] {
            width: 150px;
        }
    </style>
</head>
<body>
    <a href=index.html>Inicio</a>
    <center>
        <h1>Stabat Mater (A. Dvorak)</h1>
        <h2>
            IA. Quartett und Chor. (bars 68 - 167)
            <a href=index1B.html>Siguiente</a>
        </h2>
    </center>
    <hr>
    <h2>Selección de Voces</h2>
    <div class="controls-group">
        <label for="track-selector">Voz Activa:</label>
        <select id="track-selector">
            </select>
    </div>

    <hr>

    <audio id="audio1">
        </audio>
    
    <audio id="audio2">
        </audio>

    <div class="controls-group">
        <button id="iniciar-musica">▶️ Iniciar</button>
        <button id="parar-musica" disabled>⏹️ Detener</button>
        
        <label for="volumen-global">Volumen Global:</label>
        <input type="range" id="volumen-global" min="0" max="1" step="0.01" value="1">
    </div>

    <h2>Control de Balance (Panorámica)</h2>
    <div class="controls-group">
        <label for="pan-control" style="width: 150px;">Resto ⬅️</label>
        <input type="range" id="pan-control" min="-1" max="1" step="0.01" value="0">
        <label for="pan-control" style="width: 150px;">➡️ Voz</label>
    </div>

    <h2>Control de Velocidad</h2>
    <div class="controls-group">
        <label for="speed-control">Velocidad (0.5x a 2.0x):</label>
        <input type="range" id="speed-control" min="0.5" max="2.0" step="0.1" value="1.0">
        <span id="current-speed">1.0x</span>
    </div>

    <hr>

    <h2>Progreso de Reproducción</h2>
    <div class="progress-container" id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="time-display">0:00 / 0:00</div>

    <hr>

    <audio id="audio1">
        <source src="Stabat 1 Baj no.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="audio2">
        <source src="Stabat 1 Baj.mp3" type="audio/mpeg">
    </audio>

    <script>

    document.addEventListener('DOMContentLoaded', function() {
    // -----------------------------------------------------
    // 0. DEFINICIÓN DE PISTAS (¡IMPORTANTE: Cambia estos valores por tus rutas!)
    // El objeto 'tracks' define las parejas de audio que el usuario puede seleccionar.
    const TRACKS = [
        { name: "Soprano", src1: "Stabat 1 Sop no.mp3", src2: "Stabat 1 Sop.mp3" },
        { name: "Alto", src1: "Stabat 1 Alt no.mp3", src2: "Stabat 1 Alt.mp3" },
        { name: "Tenor", src1: "Stabat 1 Ten no.mp3", src2: "Stabat 1 Ten.mp3" },
        { name: "Bajo", src1: "Stabat 1 Baj no.mp3", src2: "Stabat 1 Baj.mp3" },
    ];
    // -----------------------------------------------------

    // 1. Obtener todas las referencias (incluyendo el nuevo selector)
    const botonInicio = document.getElementById('iniciar-musica');
    const botonParar = document.getElementById('parar-musica');
    const inputVolumenGlobal = document.getElementById('volumen-global');
    const inputPan = document.getElementById('pan-control');
    const inputSpeed = document.getElementById('speed-control');
    const speedDisplay = document.getElementById('current-speed');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const timeDisplay = document.getElementById('time-display');
    const audio1 = document.getElementById('audio1');
    const audio2 = document.getElementById('audio2');
    const trackSelector = document.getElementById('track-selector'); // NUEVA REFERENCIA

    // 2. Función auxiliar para formatear segundos a M:SS
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
    
    // --- Función para aplicar el Volumen y el Balance (sin cambios) ---
    function applyVolumeAndPan() {
        // ... (Lógica de volumen y balance anterior) ...
        const volGlobal = parseFloat(inputVolumenGlobal.value);
        const panValue = parseFloat(inputPan.value);
        let vol1, vol2;
        
        if (panValue <= 0) {
            vol1 = 1.0; 
            vol2 = 1.0 + panValue;
        } else {
            vol1 = 1.0 - panValue;
            vol2 = 1.0; 
        }

        audio1.volume = vol1 * volGlobal;
        audio2.volume = vol2 * volGlobal;
    }

    // --- Función para aplicar la Velocidad (sin cambios) ---
    function applySpeed() {
        const newSpeed = parseFloat(inputSpeed.value);
        audio1.playbackRate = newSpeed;
        audio2.playbackRate = newSpeed;
        speedDisplay.textContent = newSpeed.toFixed(1) + 'x';
    }

    // --- NUEVA FUNCIÓN: Inicializar y cambiar la pista ---
    function changeTrack(trackIndex) {
        // 1. Obtener la pista seleccionada
        const track = TRACKS[trackIndex];

        // 2. Detener y resetear el estado actual
        audio1.pause();
        audio2.pause();
        
        // 3. Aplicar las nuevas fuentes de audio
        audio1.src = track.src1;
        audio2.src = track.src2;
        
        // 4. Forzar la recarga de los archivos
        audio1.load();
        audio2.load();

        // 5. Resetear la interfaz
        audio1.currentTime = 0;
        audio2.currentTime = 0;
        progressBar.style.width = '0%';
        timeDisplay.textContent = '0:00 / 0:00';
        botonInicio.disabled = false;
        botonParar.disabled = true;

        // Opcional: Reiniciar controles de Balance/Velocidad al centro/normal
        inputPan.value = 0.0;
        inputSpeed.value = 1.0;
        applyVolumeAndPan();
        applySpeed();
    }
    
    // --- NUEVA LÓGICA DE INICIALIZACIÓN ---
    function initializeTrackSelector() {
        // 1. Rellenar el selector HTML con las pistas del array TRACKS
        TRACKS.forEach((track, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = track.name;
            trackSelector.appendChild(option);
        });

        // 2. Establecer el listener para cuando el usuario cambie la pista
        trackSelector.addEventListener('change', (e) => {
            changeTrack(e.target.value);
        });

        // 3. Cargar la primera pista por defecto
        changeTrack(0);
    }


    // 3. Lógica de INICIO y STOP (Actualizada: Ahora llama a play/pause)
    botonInicio.addEventListener('click', function() {
        audio1.play();
        audio2.play();
        botonInicio.disabled = true;
        botonParar.disabled = false;
    });

    botonParar.addEventListener('click', function() {
        audio1.pause();
        audio2.pause();
        audio1.currentTime = 0;
        audio2.currentTime = 0;
        progressBar.style.width = '0%';
        timeDisplay.textContent = '0:00 / ' + formatTime(audio1.duration || 0);
        botonParar.disabled = true;
        botonInicio.disabled = false;
    });

    // 4. Lógica de Control de Volumen y Velocidad (sin cambios)
    inputVolumenGlobal.addEventListener('input', applyVolumeAndPan);
    inputPan.addEventListener('input', applyVolumeAndPan);
    inputSpeed.addEventListener('input', applySpeed);


    // 5. Lógica de ACTUALIZACIÓN DE TIEMPO y BARRA
    audio1.addEventListener('loadedmetadata', function() {
        // Esta función se llama CADA VEZ que se carga una nueva pista
        const duration = formatTime(audio1.duration);
        timeDisplay.textContent = `0:00 / ${duration}`;
        
        // Si el audio es demasiado corto o hay un error, deshabilitamos el inicio
        if (isNaN(audio1.duration) || audio1.duration === 0) {
             botonInicio.disabled = true;
             console.error("El audio 1 no se pudo cargar correctamente. Comprueba la ruta.");
        }
        
        applyVolumeAndPan(); 
        applySpeed();
    });

    audio1.addEventListener('timeupdate', function() {
        if (!audio1.paused) {
            const currentTime = audio1.currentTime;
            const duration = audio1.duration;
            
            const progress = (currentTime / duration) * 100;
            progressBar.style.width = progress + '%';

            timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
        }
    });
        // --- NUEVO LISTENER: REHABILITAR AL TERMINAR ---
    audio1.addEventListener('ended', function() {
        // 1. Rebobinar ambas pistas al inicio (0 segundos)
        audio1.currentTime = 0;
        audio2.currentTime = 0;
        
        // 2. Desactivar la barra de progreso (visual)
        progressBar.style.width = '0%';
        
        // 3. Rehabilitar el botón de Inicio y deshabilitar el de Stop
        const botonInicio = document.getElementById('iniciar-musica');
        const botonParar = document.getElementById('parar-musica');
        
        botonInicio.disabled = false;
        botonParar.disabled = true;

        // Opcional: Volver a mostrar el tiempo inicial
        const duration = formatTime(audio1.duration);
        timeDisplay.textContent = `0:00 / ${duration}`;
    });
    // 6. Lógica de Salto Deshabilitada (sin cambios)
    
    // --- PUNTO DE ENTRADA PRINCIPAL ---
    initializeTrackSelector();
});
    </script>
</body>
</html>
